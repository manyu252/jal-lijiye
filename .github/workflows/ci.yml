name: CI Quality Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    name: Run Pytest Quality Gate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Linux GUI / Qt Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1-mesa libgl1-mesa-glx libxcb-xinerama0 libxkbcommon-x11-0 libdbus-1-3

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run python -m pytest tests/

      - name: Run Tests (macOS Native)
        if: runner.os == 'macOS'
        run: |
          python -m pytest tests/
