name: Build & Release Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Executable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: JalLijiye-Windows
          - os: macos-latest
            asset_name: JalLijiye-macOS

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pyinstaller

      - name: Build macOS Application
        if: runner.os == 'macOS'
        run: |
          pyinstaller --clean --noconfirm --onedir --windowed \
            --name "Jal Lijiye" \
            --icon "assets/icon.png" \
            --add-data "assets:assets" \
            --exclude-module "PyQt6.QtQml" \
            --exclude-module "PyQt6.QtQuick" \
            --exclude-module "PyQt6.QtNetwork" \
            --exclude-module "PyQt6.QtPdf" \
            --exclude-module "PyQt6.QtSvg" \
            --exclude-module "PyQt6.QtDBus" \
            --exclude-module "PyQt6.QtTest" \
            --exclude-module "cv2" \
            --exclude-module "numpy" \
            --exclude-module "scipy" \
            main.py

      - name: Build Windows Executable
        if: runner.os == 'Windows'
        run: |
          pyinstaller --clean --noconfirm --onedir --windowed \
            --name "Jal Lijiye" \
            --icon "assets/icon.ico" \
            --add-data "assets;assets" \
            --exclude-module "PyQt6.QtQml" \
            --exclude-module "PyQt6.QtQuick" \
            --exclude-module "PyQt6.QtNetwork" \
            --exclude-module "PyQt6.QtPdf" \
            --exclude-module "PyQt6.QtSvg" \
            --exclude-module "PyQt6.QtDBus" \
            --exclude-module "PyQt6.QtTest" \
            --exclude-module "cv2" \
            --exclude-module "numpy" \
            --exclude-module "scipy" \
            main.py

      - name: Package Windows Release Asset
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive -Path "dist/Jal Lijiye" -DestinationPath "${{ matrix.asset_name }}.zip"

      - name: Package macOS Release Asset (Preserve Symlinks)
        if: runner.os == 'macOS'
        run: |
          cd dist
          # -r = recursive, -y = preserve symlinks (prevents bloat and bundle crash)
          zip -r -y "../${{ matrix.asset_name }}.zip" "Jal Lijiye.app"

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
